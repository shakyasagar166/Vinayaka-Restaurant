# Server Configuration (Render sets $PORT dynamically)
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=vinayaka-restaurant-backend

# Database Configuration (Overrides via environment variables on Render / Neon)
# On Render: Set SPRING_DATASOURCE_URL or DATABASE_URL to your Neon connection string!
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/vinayaka_restaurant_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=VinayakaRestaurantRooftopLoungeSuperSecretKey2026SecureJwt384BitsLong
jwt.expiration=86400000

# Logging
logging.level.com.vinayaka=INFO
logging.level.org.springframework.security=WARN

# Jackson Date & Time Formatting (Indian Standard Time)
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
spring.jackson.serialization.write-dates-as-timestamps=false

