services:
  - type: web
    name: vinayaka-restaurant-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        value: VinayakaRestaurantRooftopLoungeSuperSecretKey2026SecureJwt384BitsLong
